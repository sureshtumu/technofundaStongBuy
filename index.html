    for(var i=0;i<D.length;i++){
        var s=D[i];
        var quality=(s.ltr==="Strong Buy"||s.ltr==="Buy")?"high":"low";
        var value=s.gap>0?"under":"over";
        if(quality==="high"&&value==="under") q1.push(s);      // STRONG BUY
        else if(quality==="high"&&value==="over") q2.push(s);   // HOLD/WAIT
        else if(quality==="low"&&value==="under") q3.push(s);   // OPPORTUNISTIC
        else q4.push(s);                                         // EXIT
    }
    // Sort each quadrant by gap desc (best first)
    q1.sort(function(a,b){return b.gap-a.gap});
    q2.sort(function(a,b){return b.lt-a.lt});
    q3.sort(function(a,b){return b.gap-a.gap});
    q4.sort(function(a,b){return a.gap-b.gap});

    var h='<div class="hdr"><div style="display:flex;align-items:center;gap:12px"><div class="logo" style="background:linear-gradient(135deg,#f59e0b,#ef4444)">Q4</div><div><div style="font-size:16px;font-weight:700">Decision Quadrant Map</div><div style="font-size:11px;color:#64748b">4F Quality (Y-axis) \xd7 PULSE Valuation (X-axis) \xb7 '+D.length+' Stocks</div></div></div>';
    h+='<div style="display:flex;gap:12px;align-items:center;font-size:11px;color:#94a3b8"><span>\u25cf 4F Buy/Strong Buy = High Quality</span><span>\u25cf 4F Hold/Weak = Lower Quality</span><span>\u25cf PULSE GAP > 0% = Undervalued</span><span>\u25cf PULSE GAP < 0% = Overvalued</span></div></div>';

    // Shortlist disclaimer banner
    h+='<div style="margin:8px 20px 0;padding:8px 14px;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #f59e0b55;border-left:4px solid #f59e0b;border-radius:8px;font-size:12px;color:#fbbf24;font-weight:600">\u26a0 Educational analysis of 5 stocks \u2014 not investment advice or a recommendation. Do your own research.</div>';

    // Axis labels
    h+='<div style="padding:10px 20px">';

    // Y-axis label
    h+='<div style="display:flex;gap:0;height:calc(100vh - 160px);min-height:500px">';
    h+='<div style="writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#64748b;padding:0 8px;letter-spacing:1px">4F QUALITY SCORE \u2192</div>';

    // Main 2x2 grid
    h+='<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px">';

    // ── Q1: Top-Left: STRONG BUY (High Quality + Undervalued) ──
    h+='<div style="background:linear-gradient(135deg,#052e16,#0f3d1f);border:2px solid #16a34a40;border-radius:12px;padding:12px;overflow:auto;position:relative">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-size:15px;font-weight:800;color:#16a34a">\u2705 STRONG BUY</div><div style="font-size:10px;color:#4ade80">High quality + undervalued</div><div style="font-size:9px;color:#4ade80;opacity:.8;font-style:italic">= 4F Buy/Strong Buy \u2229 PULSE undervalued (GAP&gt;0)</div></div><div class="mono" style="font-size:28px;font-weight:900;color:#16a34a">'+q1.length+'</div></div>';
    h+=renderQuadCards(q1,"#16a34a");
    h+='</div>';

    // ── Q2: Top-Right: HOLD/WAIT (High Quality + Overvalued) ──
    h+='<div style="background:linear-gradient(135deg,#1a1505,#2a2008);border:2px solid #d9770640;border-radius:12px;padding:12px;overflow:auto;position:relative">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-size:15px;font-weight:800;color:#d97706">\u23f8 HOLD / WAIT</div><div style="font-size:10px;color:#fbbf24">Quality OK \u2014 Wait for Price Correction</div><div style="font-size:9px;color:#fbbf24;opacity:.8;font-style:italic">= 4F Buy/Strong Buy \u2229 PULSE overvalued (GAP&lt;0)</div></div><div class="mono" style="font-size:28px;font-weight:900;color:#d97706">'+q2.length+'</div></div>';
    h+=renderQuadCards(q2,"#d97706");
    h+='</div>';

    // ── Q3: Bottom-Left: OPPORTUNISTIC (Low Quality + Undervalued) ──
    h+='<div style="background:linear-gradient(135deg,#0a1628,#0f1f38);border:2px solid #3b82f640;border-radius:12px;padding:12px;overflow:auto;position:relative">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-size:15px;font-weight:800;color:#3b82f6">\u2609 OPPORTUNISTIC</div><div style="font-size:10px;color:#60a5fa">Cheap \u2014 But Check Why Quality is Low</div><div style="font-size:9px;color:#60a5fa;opacity:.8;font-style:italic">= 4F Hold/Weak \u2229 PULSE undervalued (GAP&gt;0)</div></div><div class="mono" style="font-size:28px;font-weight:900;color:#3b82f6">'+q3.length+'</div></div>';
    h+=renderQuadCards(q3,"#3b82f6");
    h+='</div>';

    // ── Q4: Bottom-Right: EXIT (Low Quality + Overvalued) ──
    h+='<div style="background:linear-gradient(135deg,#1a0808,#2a0f0f);border:2px solid #dc262640;border-radius:12px;padding:12px;overflow:auto;position:relative">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-size:15px;font-weight:800;color:#dc2626">\u274c EXIT</div><div style="font-size:10px;color:#f87171">Neither Quality nor Price Supports Holding</div><div style="font-size:9px;color:#f87171;opacity:.8;font-style:italic">= 4F Hold/Weak \u2229 PULSE overvalued (GAP&lt;0)</div></div><div class="mono" style="font-size:28px;font-weight:900;color:#dc2626">'+q4.length+'</div></div>';
    h+=renderQuadCards(q4,"#dc2626");
    h+='</div>';

    h+='</div></div>';  // close grid + flex

    // X-axis label
    h+='<div style="text-align:center;font-size:13px;font-weight:700;color:#64748b;padding:8px 0;letter-spacing:1px">\u2190 PULSE UNDERVALUED (GAP > 0%)  \u2502  PULSE OVERVALUED (GAP < 0%) \u2192</div>';

    // Summary strip
    h+='<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 0;font-size:11px">';
    h+='<span style="color:#16a34a;font-weight:700">\u25a0 Strong Buy: '+q1.length+'</span>';
    h+='<span style="color:#64748b">\xb7</span>';
    h+='<span style="color:#d97706;font-weight:700">\u25a0 Hold/Wait: '+q2.length+'</span>';
    h+='<span style="color:#64748b">\xb7</span>';
    h+='<span style="color:#3b82f6;font-weight:700">\u25a0 Opportunistic: '+q3.length+'</span>';
    h+='<span style="color:#64748b">\xb7</span>';
    h+='<span style="color:#dc2626;font-weight:700">\u25a0 Exit: '+q4.length+'</span>';
    h+='</div></div>';
    return h;
}

function renderQuadCards(stocks,accentClr){
    var h='<div style="display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start">';
    for(var i=0;i<stocks.length;i++){
        var s=stocks[i];
        var gc=s.gap>0?"#16a34a":"#dc2626";
        var bg=accentClr+"10";
        h+='<div onclick="sel=D.indexOf(D.filter(function(x){return x.t===\''+s.t+'\'})[0]);mainTab=\'consolidated\';view=\'single\';render()" style="cursor:pointer;background:'+bg+';border:1px solid '+accentClr+'30;border-radius:8px;padding:8px 10px;min-width:140px;flex:1;max-width:200px;transition:all .15s" onmouseover="this.style.borderColor=\''+accentClr+'\';this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.borderColor=\''+accentClr+'30\';this.style.transform=\'none\'">';
        h+='<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:800;color:#60a5fa;font-family:\'JetBrains Mono\',monospace">'+s.t+'</span><span class="mono" style="font-size:11px;font-weight:700;color:'+gc+'">'+(s.gap>0?"+":"")+s.gap.toFixed(0)+'%</span></div>';
        h+='<div style="font-size:9px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+s.n.substring(0,22)+'</div>';
        h+='<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;font-family:\'JetBrains Mono\',monospace">';
        h+='<span style="color:#94a3b8">LT:<span style="color:'+(s.lt>=60?"#16a34a":"#d97706")+';font-weight:700">'+s.lt+'</span></span>';
        h+='<span style="color:#94a3b8">\u20b9'+fmt(s.cmp)+'</span>';
        h+='</div>';
        h+='<div style="display:flex;justify-content:space-between;margin-top:2px;font-size:10px;font-family:\'JetBrains Mono\',monospace">';
        h+='<span style="color:#94a3b8">Fair:<span style="color:'+gc+';font-weight:700">\u20b9'+fmt(s.fp)+'</span></span>';
        h+='<span>'+pill(s.bhs)+'</span>';
        h+='</div>';
        // Drill-down flags: conviction + data warning (so triage shows what to check)
        var convC=(s.conv==="Converge")?"#16a34a":(s.conv==="Diverge")?"#f59e0b":"#94a3b8";
        var warnTxt=(s.warn&&s.warn!=="CLEAN")?s.warn:"";
        h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:9px">';
        h+='<span style="color:'+convC+';font-weight:700">'+(s.conv==="Diverge"?"\u26a0 ":"")+(s.conv||"")+'</span>';
        if(warnTxt) h+='<span style="color:#dc2626;font-weight:700" title="'+warnTxt+'">\u26a0 '+warnTxt.substring(0,12)+'</span>';
        else h+='<span style="color:#16a34a">\u2713 Clean</span>';
        h+='</div>';
        h+='</div>';
    }
    h+='</div>';
    return h;
}
